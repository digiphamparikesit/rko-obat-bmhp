<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembelian — RKO RSAMP</title>
<style>
  :root {
    --green-deep: #0F3D2E; --green-mid: #16A34A; --green-bright: #3FCF6A; --green-soft: #E7F5EC;
    --bg: #F4F7F4; --card: #FFFFFF; --text-dark: #14201A; --text-muted: #6B7A72;
    --amber: #D97706; --coral: #DC5B45; --border: #E4EAE5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text-dark); }

  #gate { position: fixed; inset: 0; background: var(--green-deep); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .gate-box { background: #fff; border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 360px; text-align: center; }
  .gate-box .mark { width: 44px; height: 44px; border-radius: 12px; background: var(--green-bright); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--green-deep); margin: 0 auto 14px; }
  .gate-box h1 { font-size: 17px; margin: 0 0 4px; }
  .gate-box p { font-size: 13px; color: var(--text-muted); margin: 0 0 18px; }
  .gate-box input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; margin-bottom: 10px; }
  .gate-box button { width: 100%; padding: 11px; border: none; border-radius: 9px; background: var(--green-mid); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
  .gate-box button:hover { background: #128a3e; }
  .gate-msg { font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .gate-msg.error { color: var(--coral); }
  .gate-msg.loading { color: var(--text-muted); }

  header.topbar { position: sticky; top: 0; z-index: 100; background: var(--green-deep); color: #fff; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--green-bright); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--green-deep); }
  .brand .label { font-size: 12px; color: rgba(255,255,255,0.65); line-height: 1.2; }
  .brand .title { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .who { font-size: 12.5px; color: rgba(255,255,255,0.85); }
  a.back { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13px; }
  a.back:hover { color: #fff; }
  .topbar select { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; }
  select option { color: #14201A; }

  main { max-width: 100%; margin: 0; padding: 24px 20px 60px; }

  .layout-split { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; align-items: start; }
  .left-col { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 90px; }
  .side-panel { padding: 18px 20px; }
  .side-title { font-size: 14px; margin: 0 0 12px; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
  .field select, .field input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }

  @media (max-width: 860px) {
    .layout-split { grid-template-columns: 1fr; }
    .left-col { position: static; }
  }

  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input[type="text"] { flex: 1; min-width: 220px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 9px; font-size: 13.5px; }
  .btn { padding: 10px 16px; border: none; border-radius: 9px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
  .btn-primary { background: var(--green-mid); color: #fff; }
  .btn-primary:hover { background: #128a3e; }
  .btn-secondary { background: #F1F1EE; color: var(--text-dark); }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 900px; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; background: #FAFBFA; }
  td.num { text-align: right; }

  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .badge.draft { background: #F1F1EE; color: var(--text-muted); }
  .badge.dikirim { background: #FDF1E0; color: var(--amber); }
  .badge.sebagian { background: #FBEAE7; color: var(--coral); }
  .badge.selesai { background: var(--green-soft); color: var(--green-mid); }

  select.status-select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 7px; font-size: 12px; }

  #modalOverlay { display: none; position: fixed; inset: 0; background: rgba(15,61,46,0.45); align-items: center; justify-content: center; z-index: 40; padding: 20px; }
  #modalOverlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; padding: 26px; }
  .modal h2 { font-size: 16px; margin: 0 0 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--text-muted); }
  .field input, .field select { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .form-msg { font-size: 12.5px; color: var(--coral); min-height: 16px; margin-top: 6px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13.5px; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div class="mark">RS</div>
    <h1>Masuk ke Pembelian</h1>
    <p>Khusus tim pembelian, admin, dan super admin.</p>
    <input type="email" id="gateEmail" placeholder="nama@rsamp.go.id" autocomplete="email">
    <button onclick="login()">Masuk</button>
    <div class="gate-msg" id="gateMsg"></div>
  </div>
</div>

<div id="appContent" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <div class="mark">RS</div>
      <div>
        <div class="title">RKO RSAMP</div>
        <div class="label">Pembelian — buat &amp; kelola PO</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="who" id="whoLabel"></span>
      <select id="bulanSelect"></select>
      <select id="tahunSelect"></select>
      <a class="back" href="index.html">&#8592; Menu utama</a>
    </div>
  </header>

  <main>
    <div class="layout-split">
      <aside class="left-col">
        <div class="panel side-panel">
          <h2 class="side-title">Cari &amp; Filter</h2>
          <div class="field">
            <label>Cari nama barang / no. PO</label>
            <input type="text" id="searchBox" placeholder="Cari nama barang atau no. PO...">
          </div>
          <div class="field">
            <label>Golongan</label>
            <select id="filterGolongan">
              <option value="">Semua golongan</option>
              <option value="OBAT">Obat</option>
              <option value="BMHP">BMHP</option>
              <option value="BHP">BHP</option>
              <option value="B3">B3</option>
              <option value="NUTRISI ENTERAL">Nutrisi Enteral</option>
              <option value="PROGRAM">Program</option>
              <option value="PROGRAM TB">Program TB</option>
              <option value="PROGRAM HIV">Program HIV</option>
              <option value="PROGRAM MALARIA">Program Malaria</option>
              <option value="PROGRAM RABIES">Program Rabies</option>
              <option value="PROGRAM BKKBN">Program BKKBN</option>
              <option value="PROGRAM COVID">Program Covid</option>
              <option value="PROGRAM STUNTING">Program Stunting</option>
              <option value="PROGRAM IMUNISASI">Program Imunisasi</option>
            </select>
          </div>
          <div class="field">
            <label>Status PO</label>
            <select id="filterStatus">
              <option value="">Semua status</option>
              <option value="DRAFT">Draft</option>
              <option value="DIKIRIM">Dikirim</option>
              <option value="DITERIMA_SEBAGIAN">Diterima sebagian</option>
              <option value="SELESAI">Selesai</option>
            </select>
          </div>
          <button class="btn btn-primary" style="width:100%;" onclick="openForm()">+ Buat PO Baru</button>
        </div>
      </aside>

      <section class="right-col">
        <div class="panel">
          <table>
            <thead>
              <tr>
                <th>No. PO</th>
                <th>Nama barang</th>
                <th>Distributor</th>
                <th class="num">Qty pesan</th>
                <th>Tanggal PO</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tableBody"><tr><td colspan="6" class="empty-state">Memuat data...</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<div id="modalOverlay">
  <div class="modal">
    <h2>Buat PO Baru</h2>
    <div class="field">
      <label>No. PO</label>
      <input type="text" id="fNoPo" placeholder="mis. PO-2026-08-001">
    </div>
    <div class="field">
      <label>Barang (dari rencana belanja periode ini)</label>
      <select id="fBarang"><option value="">Pilih barang...</option></select>
    </div>
    <div class="field">
      <label>Distributor</label>
      <select id="fDistributor"><option value="">Pilih distributor...</option></select>
    </div>
    <div class="field">
      <label>Qty pesan</label>
      <input type="number" id="fQty" placeholder="0">
    </div>
    <div class="field">
      <label>Tanggal PO</label>
      <input type="date" id="fTanggal">
    </div>
    <div class="field">
      <label>Status awal</label>
      <select id="fStatus">
        <option value="DRAFT">Draft</option>
        <option value="DIKIRIM">Dikirim ke distributor</option>
      </select>
    </div>
    <div class="form-msg" id="formMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeForm()">Batal</button>
      <button class="btn btn-primary" onclick="submitForm()">Simpan PO</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxDRPAfelh1J9dSSgcZaWvaQy-FgKh-fxd01LL_2pU2Bj0LhsPsqyOmVTlhuQKdYLsb/exec";

  let currentUser = null;
  let barangMap = {};
  let distributorList = [];
  let rencanaList = [];
  let pembelianList = [];
  let filteredList = [];

  function login() {
    const email = document.getElementById('gateEmail').value.trim();
    const msg = document.getElementById('gateMsg');
    if (!email) { msg.textContent = 'Isi email dulu.'; msg.className = 'gate-msg error'; return; }
    msg.textContent = 'Memeriksa akses...'; msg.className = 'gate-msg loading';

    fetch(API_URL + '?action=whoAmI&email=' + encodeURIComponent(email))
      .then(res => res.json())
      .then(res => {
        if (!res.success || !res.data) { msg.textContent = 'Email tidak terdaftar atau tidak aktif.'; msg.className = 'gate-msg error'; return; }
        const allowed = ['TIM_PEMBELIAN', 'ADMIN', 'SUPER_ADMIN'];
        if (allowed.indexOf(res.data.ROLE) === -1) { msg.textContent = 'Akun Anda (' + res.data.ROLE + ') tidak punya akses ke halaman ini.'; msg.className = 'gate-msg error'; return; }
        currentUser = res.data;
        document.getElementById('gate').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        document.getElementById('whoLabel').textContent = currentUser.NAMA + ' · ' + currentUser.ROLE;
        initData();
      })
      .catch(() => { msg.textContent = 'Gagal menghubungi server. Cek koneksi.'; msg.className = 'gate-msg error'; });
  }

  function initData() {
    const now = new Date();
    fillPeriodOptions(now.getMonth() + 1, now.getFullYear());
    loadAllData();
    document.getElementById('bulanSelect').addEventListener('change', loadAllData);
    document.getElementById('tahunSelect').addEventListener('change', loadAllData);
    document.getElementById('searchBox').addEventListener('input', applyFilter);
    document.getElementById('filterGolongan').addEventListener('change', applyFilter);
    document.getElementById('filterStatus').addEventListener('change', applyFilter);
  }

  function fillPeriodOptions(curBulan, curTahun) {
    const bulanSel = document.getElementById('bulanSelect');
    const namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    namaBulan.forEach((nm, i) => {
      const opt = document.createElement('option');
      opt.value = i + 1; opt.textContent = nm;
      if (i + 1 === curBulan) opt.selected = true;
      bulanSel.appendChild(opt);
    });
    const tahunSel = document.getElementById('tahunSelect');
    for (let y = curTahun - 1; y <= curTahun + 1; y++) {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      if (y === curTahun) opt.selected = true;
      tahunSel.appendChild(opt);
    }
  }

  function loadAllData() {
    const bulan = document.getElementById('bulanSelect').value;
    const tahun = document.getElementById('tahunSelect').value;
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="empty-state">Memuat data...</td></tr>';

    Promise.all([
      fetch(API_URL + '?action=getMasterBarang').then(r => r.json()),
      fetch(API_URL + '?action=getMasterDistributor').then(r => r.json()),
      fetch(API_URL + `?action=getRencanaBelanja&bulan=${bulan}&tahun=${tahun}`).then(r => r.json()),
      fetch(API_URL + `?action=getPembelian&bulan=${bulan}&tahun=${tahun}`).then(r => r.json())
    ]).then(([barangRes, distRes, rencanaRes, pembelianRes]) => {
      barangMap = {};
      (barangRes.success ? barangRes.data : []).forEach(b => { barangMap[b.ID] = b; });
      distributorList = distRes.success ? distRes.data : [];
      rencanaList = rencanaRes.success ? rencanaRes.data : [];
      pembelianList = pembelianRes.success ? pembelianRes.data : [];

      fillFormOptions();
      applyFilter();
    }).catch(() => {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="empty-state">Gagal memuat data dari server.</td></tr>';
    });
  }

  function fillFormOptions() {
    const bSel = document.getElementById('fBarang');
    bSel.innerHTML = '<option value="">Pilih barang...</option>';
    rencanaList.forEach(r => {
      const barang = barangMap[r.BARANG_ID];
      if (!barang) return;
      const opt = document.createElement('option');
      opt.value = r.BARANG_ID; opt.dataset.distributor = r.DISTRIBUTOR_ID;
      opt.textContent = barang.NAMA_BARANG + ' (rencana: ' + r.RENCANA_QTY_SATUAN_BELI + ')';
      bSel.appendChild(opt);
    });

    const dSel = document.getElementById('fDistributor');
    dSel.innerHTML = '<option value="">Pilih distributor...</option>';
    distributorList.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.ID; opt.textContent = d.NAMA_DISTRIBUTOR;
      dSel.appendChild(opt);
    });

    bSel.addEventListener('change', () => {
      const selected = bSel.options[bSel.selectedIndex];
      if (selected && selected.dataset.distributor) dSel.value = selected.dataset.distributor;
    });
  }

  function applyFilter() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const golongan = document.getElementById('filterGolongan').value;
    const status = document.getElementById('filterStatus').value;
    filteredList = pembelianList.filter(p => {
      const barang = barangMap[p.BARANG_ID];
      const nama = barang ? barang.NAMA_BARANG : '';
      const matchQ = !q || nama.toLowerCase().includes(q) || String(p.NO_PO).toLowerCase().includes(q);
      const matchG = !golongan || (barang && barang.GOLONGAN === golongan);
      const matchS = !status || p.STATUS === status;
      return matchQ && matchG && matchS;
    });
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    if (filteredList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Belum ada PO untuk periode ini.</td></tr>';
      return;
    }
    tbody.innerHTML = filteredList.map(p => {
      const barang = barangMap[p.BARANG_ID] || {};
      const dist = distributorList.find(d => d.ID === p.DISTRIBUTOR_ID);
      const statusClass = { DRAFT: 'draft', DIKIRIM: 'dikirim', DITERIMA_SEBAGIAN: 'sebagian', SELESAI: 'selesai' }[p.STATUS] || 'draft';
      const statusLabel = { DRAFT: 'Draft', DIKIRIM: 'Dikirim', DITERIMA_SEBAGIAN: 'Diterima sebagian', SELESAI: 'Selesai' }[p.STATUS] || p.STATUS;
      return `
        <tr>
          <td>${escapeHtml(p.NO_PO)}</td>
          <td>${escapeHtml(barang.NAMA_BARANG || 'Tidak dikenal')}</td>
          <td>${escapeHtml(dist ? dist.NAMA_DISTRIBUTOR : '-')}</td>
          <td class="num">${Number(p.QTY_PESAN || 0).toLocaleString('id-ID')}</td>
          <td>${escapeHtml(p.TANGGAL_PO || '-')}</td>
          <td>
            <select class="status-select" onchange="updateStatus(${p.ID}, this.value)">
              <option value="DRAFT" ${p.STATUS === 'DRAFT' ? 'selected' : ''}>Draft</option>
              <option value="DIKIRIM" ${p.STATUS === 'DIKIRIM' ? 'selected' : ''}>Dikirim</option>
              <option value="DITERIMA_SEBAGIAN" ${p.STATUS === 'DITERIMA_SEBAGIAN' ? 'selected' : ''}>Diterima sebagian</option>
              <option value="SELESAI" ${p.STATUS === 'SELESAI' ? 'selected' : ''}>Selesai</option>
            </select>
          </td>
        </tr>`;
    }).join('');
  }

  function updateStatus(id, status) {
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'setStatusPembelian', email: currentUser.EMAIL, id, status })
    }).then(r => r.json()).then(res => {
      if (!res.success) alert(res.message);
      else loadAllData();
    });
  }

  function openForm() {
    document.getElementById('formMsg').textContent = '';
    document.getElementById('fNoPo').value = '';
    document.getElementById('fBarang').value = '';
    document.getElementById('fDistributor').value = '';
    document.getElementById('fQty').value = '';
    document.getElementById('fTanggal').value = '';
    document.getElementById('fStatus').value = 'DRAFT';
    document.getElementById('modalOverlay').classList.add('show');
  }
  function closeForm() { document.getElementById('modalOverlay').classList.remove('show'); }

  function submitForm() {
    const noPo = document.getElementById('fNoPo').value.trim();
    const barangId = document.getElementById('fBarang').value;
    const distId = document.getElementById('fDistributor').value;
    const qty = Number(document.getElementById('fQty').value) || 0;
    const msg = document.getElementById('formMsg');

    if (!noPo) { msg.textContent = 'Isi No. PO dulu.'; return; }
    if (!barangId) { msg.textContent = 'Pilih barang dulu.'; return; }
    if (!distId) { msg.textContent = 'Pilih distributor dulu.'; return; }
    if (qty <= 0) { msg.textContent = 'Qty pesan harus lebih dari 0.'; return; }

    msg.textContent = 'Menyimpan...';

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'addPembelian',
        email: currentUser.EMAIL,
        no_po: noPo,
        barang_id: barangId,
        distributor_id: distId,
        bulan: document.getElementById('bulanSelect').value,
        tahun: document.getElementById('tahunSelect').value,
        qty_pesan: qty,
        tanggal_po: document.getElementById('fTanggal').value,
        status: document.getElementById('fStatus').value
      })
    }).then(r => r.json()).then(res => {
      if (!res.success) { msg.textContent = res.message; return; }
      closeForm();
      loadAllData();
    }).catch(() => { msg.textContent = 'Gagal menyimpan. Cek koneksi.'; });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
  }
</script>
</body>
</html>
