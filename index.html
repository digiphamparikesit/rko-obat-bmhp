<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKO RSAMP</title>
<style>
  :root {
    --bg-green: #3FCF6A;
    --bg-green-dark: #2FB558;
    --card: #F3E7D8;
    --card-hover: #ECDBC4;
    --text-dark: #2B2B28;
    --text-muted: #4A4A45;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-green);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  .page {
    width: 100%;
    max-width: 520px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  h1 {
    color: #ffffff;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin: 0 0 8px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  .subtitle {
    color: rgba(255,255,255,0.9);
    font-size: 15px;
    font-weight: 500;
    margin: 0;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .menu-btn {
    display: block;
    background: var(--card);
    border-radius: 12px;
    padding: 20px 24px;
    text-decoration: none;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .menu-btn:hover,
  .menu-btn:focus-visible {
    background: var(--card-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.16);
  }

  .menu-btn:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }

  .menu-title {
    color: var(--text-dark);
    font-size: 18px;
    font-weight: 600;
    display: block;
  }

  .menu-desc {
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 400;
    display: block;
    margin-top: 4px;
  }

  footer {
    text-align: center;
    margin-top: 36px;
    color: rgba(255,255,255,0.8);
    font-size: 12px;
  }

  @media (max-width: 400px) {
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>RKO RSAMP</h1>
      <p class="subtitle">Efisiensi TujuanKU</p>
    </header>

    <nav>
      <a class="menu-btn" href="dashboard.html">
        <span class="menu-title">Dashboard RKO</span>
      </a>

      <a class="menu-btn" href="admin.html">
        <span class="menu-title">Admin</span>
        <span class="menu-desc">Khusus super admin</span>
      </a>

      <a class="menu-btn" href="user.html">
        <span class="menu-title">User</span>
        <span class="menu-desc">Untuk seluruh unit</span>
      </a>

      <a class="menu-btn" href="gudang-farmasi.html">
        <span class="menu-title">Gudang Farmasi</span>
      </a>

      <a class="menu-btn" href="distributor.html">
        <span class="menu-title">Distributor</span>
      </a>

      <a class="menu-btn" href="laporan.html">
        <span class="menu-title">Laporan</span>
      </a>

      <a class="menu-btn" href="keuangan.html">
        <span class="menu-title">Keuangan</span>
        <span class="menu-desc">Input anggaran &amp; realisasi belanja</span>
      </a>
    </nav>

    <footer>RKO Obat &amp; BMHP &middot; RS AM Parikesit</footer>
  </div>
</body>
</html>
