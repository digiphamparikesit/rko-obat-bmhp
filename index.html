<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKO RSAMP</title>
<style>
  :root {
    --bg-green: #3FCF6A;
    --bg-green-dark: #1F9950;
    --text-dark: #14201A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-green) 0%, var(--bg-green-dark) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }

  .phone {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    padding: 22px 20px 40px;
    display: flex;
    flex-direction: column;
  }

  /* status-bar style clock, biar berasa layar HP */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: rgba(255,255,255,0.9);
    font-size: 13px;
    font-weight: 600;
    padding: 0 4px 14px;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  .logo-circle {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: rgba(255,255,255,0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  }
  .logo-circle svg { width: 34px; height: 34px; }

  h1 {
    color: #ffffff;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.2px;
    margin: 0 0 4px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    line-height: 1.3;
  }

  .subtitle {
    color: rgba(255,255,255,0.85);
    font-size: 12.5px;
    font-weight: 500;
    margin: 0;
  }

  /* widget kecil ala HP: ringkasan singkat */
  .widget {
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 18px;
    padding: 14px 18px;
    margin-bottom: 26px;
    display: flex;
    justify-content: space-between;
    color: #fff;
  }
  .widget .item { text-align: center; flex: 1; }
  .widget .item .num { font-size: 15px; font-weight: 700; }
  .widget .item .lbl { font-size: 10.5px; color: rgba(255,255,255,0.8); margin-top: 2px; }
  .widget .divider { width: 1px; background: rgba(255,255,255,0.25); margin: 2px 0; }

  /* grid ikon ala home screen */
  .app-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    row-gap: 22px;
    column-gap: 8px;
  }

  .app-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    gap: 7px;
  }

  .app-icon {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .app-item:active .app-icon {
    transform: scale(0.92);
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }

  .app-icon svg { width: 27px; height: 27px; }

  .app-label {
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    line-height: 1.25;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }

  .icon-dashboard { background: linear-gradient(135deg, #2563EB, #1D4ED8); }
  .icon-admin     { background: linear-gradient(135deg, #F59E0B, #D97706); }
  .icon-user      { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
  .icon-gudang    { background: linear-gradient(135deg, #92400E, #78350F); }
  .icon-distributor { background: linear-gradient(135deg, #4F46E5, #4338CA); }
  .icon-laporan   { background: linear-gradient(135deg, #EC4899, #DB2777); }
  .icon-keuangan  { background: linear-gradient(135deg, #059669, #047857); }
  .icon-pembelian { background: linear-gradient(135deg, #0891B2, #0E7490); }
  .icon-penerimaan { background: linear-gradient(135deg, #65A30D, #4D7C0F); }

  footer {
    text-align: center;
    margin-top: auto;
    padding-top: 30px;
    color: rgba(255,255,255,0.75);
    font-size: 11px;
  }

  @media (max-width: 340px) {
    .app-grid { column-gap: 4px; }
    .app-icon { width: 52px; height: 52px; }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span id="clock">--:--</span>

    </div>

    <header>

      <h1>RSUD Aji Muhammad Parikesit</h1>
      <p class="subtitle">RKO RSAMP &middot; Efisiensi TujuanKU</p>

    <div class="widget">
      <div class="item">
        <div class="num">9</div>
        <div class="lbl">Menu aktif</div>
      </div>
      <div class="divider"></div>
      <div class="item">
        <div class="num" id="widgetDate">-</div>
        <div class="lbl">Periode berjalan</div>
      </div>
      <div class="divider"></div>
      <div class="item">
        <div class="num">●</div>
        <div class="lbl">Sistem online</div>
      </div>
    </div>

    <nav class="app-grid">
      <a class="app-item" href="dashboard.html">
        <div class="app-icon icon-dashboard">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="app-label">Dashboard RKO</span>
      </a>

      <a class="app-item" href="admin.html">
        <div class="app-icon icon-admin">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="#fff" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009.1 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9.1 1.65 1.65 0 004.27 7.28l-.06-.06A2 2 0 117.04 4.4l.06.06A1.65 1.65 0 008.92 4.8h.08A1.65 1.65 0 0010.5 3.3V3a2 2 0 114 0v.09c0 .69.39 1.32 1 1.62.6.3 1.32.2 1.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.3.6.9 1 1.6 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="app-label">Admin</span>
      </a>

      <a class="app-item" href="user.html">
        <div class="app-icon icon-user">
          <svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7" r="4" stroke="#fff" stroke-width="2"/></svg>
        </div>
        <span class="app-label">User</span>
      </a>

      <a class="app-item" href="gudang-farmasi.html">
        <div class="app-icon icon-gudang">
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 8l-9-5-9 5 9 5 9-5z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M3 8v8l9 5 9-5V8M12 13v8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="app-label">Gudang Farmasi</span>
      </a>

      <a class="app-item" href="distributor.html">
        <div class="app-icon icon-distributor">
          <svg viewBox="0 0 24 24" fill="none"><path d="M1 3h15v13H1z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M16 8h4l3 3v5h-7V8z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="5.5" cy="18.5" r="2.5" stroke="#fff" stroke-width="2"/><circle cx="18.5" cy="18.5" r="2.5" stroke="#fff" stroke-width="2"/></svg>
        </div>
        <span class="app-label">Distributor</span>
      </a>

      <a class="app-item" href="laporan.html">
        <div class="app-icon icon-laporan">
          <svg viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v6h6M9 13h6M9 17h6M9 9h1" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="app-label">Laporan</span>
      </a>

      <a class="app-item" href="keuangan.html">
        <div class="app-icon icon-keuangan">
          <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="12" rx="2" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="#fff" stroke-width="2"/><path d="M6 6v0M18 18v0" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="app-label">Keuangan</span>
      </a>

      <a class="app-item" href="pembelian.html">
        <div class="app-icon icon-pembelian">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="21" r="1.5" fill="#fff"/><circle cx="18" cy="21" r="1.5" fill="#fff"/><path d="M2 3h2l2.4 12.2a2 2 0 002 1.8h8.8a2 2 0 002-1.8L21 7H6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="app-label">Pembelian</span>
      </a>

      <a class="app-item" href="penerimaan.html">
        <div class="app-icon icon-penerimaan">
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 8l-9-5-9 5 9 5 9-5z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M3 8v8l9 5 9-5V8" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M12 13l4-6M12 13V5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <span class="app-label">Penerimaan Barang</span>
      </a>
    </nav>

    <footer>RKO Obat &amp; BMHP &middot; RSUD Aji Muhammad Parikesit</footer>
  </div>

<script>
  function updateClock() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = hh + ':' + mm;

    const hariList = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    document.getElementById('dateLabel').textContent = hariList[now.getDay()] + ', ' + now.getDate() + '/' + (now.getMonth()+1);

    const bulanList = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    document.getElementById('widgetDate').textContent = bulanList[now.getMonth()] + ' ' + now.getFullYear();
  }
  updateClock();
  setInterval(updateClock, 30000);
</script>
</body>
</html>
